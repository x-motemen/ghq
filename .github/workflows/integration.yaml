name: integration
on:
  pull_request:
    types:
    - labeled
  push:
    branches:
    - master
permissions:
  contents: read
jobs:
  test:
    if: github.event_name == 'push' || github.event.label.name == 'integration'
    timeout-minutes: 20
    runs-on: macos-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: setup go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
    - name: install
      run: |
        make install
        brew reinstall git || true
        brew link --overwrite git
        brew install git-svn mercurial fossil breezy darcs
        brew upgrade git-svn mercurial fossil breezy darcs
    - name: test
      run: PATH=$HOME/bin:$PATH ./misc/author/integration_test.sh
