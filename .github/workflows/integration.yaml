name: integration
on:
  pull_request:
    paths:
    - .github/workflows/integration.yaml
    - misc/author/integration_test.sh
  push:
    branches:
    - master
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 20
    runs-on: macos-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: setup go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
    - name: install
      run: |
        make install
        brew reinstall git || true
        brew link --overwrite git
        brew install git-svn mercurial fossil breezy darcs
        brew upgrade git-svn mercurial fossil breezy darcs
    - name: test
      run: PATH=$HOME/bin:$PATH ./misc/author/integration_test.sh
