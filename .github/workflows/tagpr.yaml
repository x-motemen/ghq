name: tagpr
on:
  push:
    branches:
    - "master"
  workflow_dispatch:

jobs:
  tagpr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: setup go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - uses: Songmu/gocredits@82ac47e5c3154f8bbdcaa72eb89cf1a4953282d9 # v1.0.1
    - name: tagpr
      id: tagpr
      uses: Songmu/tagpr@967f2ab22be958948fb5bd439bfa3d404dd9dee8 # v1.21.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dispatch-release:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
    - name: dispatch release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.tagpr.outputs.tag }}
      run: gh workflow run release.yaml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
