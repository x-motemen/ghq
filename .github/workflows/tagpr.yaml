name: tagpr
on:
  push:
    branches:
    - "master"
  workflow_dispatch:

jobs:
  tagpr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: setup go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
    - name: tagpr
      id: tagpr
      uses: Songmu/tagpr@v1.22.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dispatch-release:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
    - name: dispatch release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.tagpr.outputs.tag }}
      run: gh workflow run release.yaml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
